# Taplo 0.9 cannot resolve SchemaStore's split Cargo lint schemas.
#:schema https://raw.githubusercontent.com/SchemaStore/schemastore/cf458e6e33141d3a0506f24279de79eeeeb5130a/src/schemas/json/cargo.json

[package]
name = "elfex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
elfex = { path = ".." }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"

[[bin]]
name = "fuzz-elf-headers"
path = "fuzz_targets/fuzz-elf-headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-elf-parse"
path = "fuzz_targets/fuzz-elf-parse.rs"
test = false
doc = false
bench = false
