# Taplo 0.9 cannot resolve SchemaStore's split Cargo lint schemas.
#:schema https://raw.githubusercontent.com/SchemaStore/schemastore/cf458e6e33141d3a0506f24279de79eeeeb5130a/src/schemas/json/cargo.json

[package]
name = "elfex"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A no_std-friendly parser, editor, and builder for raw and mapped ELF executable images"
license = "MIT"
repository = "https://github.com/hexomethyl/elfex"
readme = "README.md"
keywords = ["elf", "executable", "linux", "binary", "parser"]
categories = ["parsing", "development-tools"]
documentation = "https://docs.rs/elfex"
exclude = ["/tests/corpus/", "/tests/features/", "/fuzz/", "/.github/"]

[features]
default = ["std"]
std = []

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"
